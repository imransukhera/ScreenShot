<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desktop Monitor — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f23; color: #e0e0e0;
      height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 14px; padding: 36px 32px; width: 360px;
    }
    .logo { text-align: center; margin-bottom: 8px; font-size: 18px; font-weight: 700; color: #4fc3f7; }
    .logo span { color: #7c4dff; }
    .sub { text-align: center; font-size: 12px; color: #9e9e9e; margin-bottom: 28px; }
    label { display: block; font-size: 12px; color: #9e9e9e; margin-bottom: 6px; margin-top: 16px; }
    input {
      width: 100%; background: #0f0f23; border: 1px solid #2a2a4a;
      color: #e0e0e0; border-radius: 7px; padding: 10px 12px;
      font-size: 14px; outline: none; transition: border-color 0.15s;
    }
    input:focus { border-color: #4fc3f7; }
    .btn {
      width: 100%; margin-top: 24px; background: #4fc3f7; color: #000;
      border: none; border-radius: 7px; padding: 11px; font-size: 14px;
      font-weight: 700; cursor: pointer; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #ff5252; font-size: 12px; margin-top: 12px; text-align: center; min-height: 18px; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.3); border-top-color: #000; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📹 Desktop<span>Monitor</span></div>
    <div class="sub">Employee Monitoring System</div>

    <label>Company Name</label>
    <input type="text" id="companyName" placeholder="Acme Corp" autocomplete="organization" />

    <label>Work Email</label>
    <input type="email" id="email" placeholder="you@company.com" autocomplete="email" />

    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />

    <button class="btn" id="signInBtn" onclick="signIn()">Sign In</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script>
    let firebaseConfig = null;

    async function init() {
      firebaseConfig = await window.loginBridge.getConfig();
      firebase.initializeApp(firebaseConfig);
    }

    async function signIn() {
      const companyName = document.getElementById('companyName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('signInBtn');
      const errorEl = document.getElementById('errorMsg');

      errorEl.textContent = '';
      if (!companyName) { errorEl.textContent = 'Please enter your company name.'; return; }
      if (!email || !password) { errorEl.textContent = 'Please enter your email and password.'; return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in...';

      try {
        const cred = await firebase.auth().signInWithEmailAndPassword(email, password);
        const user = cred.user;
        await window.loginBridge.loginSuccess({
          uid: user.uid,
          email: user.email,
          refreshToken: user.refreshToken,
          companyName
        });
      } catch (err) {
        let msg = 'Sign in failed. Please try again.';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          msg = 'Invalid email or password.';
        } else if (err.code === 'auth/too-many-requests') {
          msg = 'Too many attempts. Please try again later.';
        } else if (err.code === 'auth/network-request-failed') {
          msg = 'No internet connection.';
        }
        errorEl.textContent = msg;
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
